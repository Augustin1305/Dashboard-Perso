<div style="position: absolute; left: {{p.l}}px; top: {{p.t}}px; width: 28px; height: 35px; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.18))">
<svg width="28" height="35" viewBox="0 0 24 30" aria-label="{{p.label}}"><path d="M12 1.5C6.2 1.5 1.5 6.1 1.5 11.8 1.5 19.3 12 28.5 12 28.5S22.5 19.3 22.5 11.8C22.5 6.1 17.8 1.5 12 1.5Z" fill="{{p.c}}" stroke="#F6F3EC" stroke-width="1.8"/><circle cx="12" cy="11.6" r="5.8" fill="none" stroke="#F6F3EC" stroke-width="0.9" opacity="0.6"/><circle cx="12" cy="11.6" r="2.6" fill="#F6F3EC"/></svg>
</div>
</sc-for>

<a href="{{L.fiche}}" aria-label="Ouvrir Chez Odette" style="position: absolute; left: 150px; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 10px; background: {{t.surface}}; border-radius: 999px; box-shadow: {{t.shadow}}; white-space: nowrap">
<span style="width: 10px; height: 10px; border-radius: 999px; background: #E4572E"></span>
<span style="font-size: 13px; font-weight: 600">Chez Odette</span>
<span style="font-size: 13px; color: {{t.muted}}">Coup de cœur</span>
</div>
<div style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.22))">
<svg width="38" height="48" viewBox="0 0 24 30"><path d="M12 1.5C6.2 1.5 1.5 6.1 1.5 11.8 1.5 19.3 12 28.5 12 28.5S22.5 19.3 22.5 11.8C22.5 6.1 17.8 1.5 12 1.5Z" fill="#E4572E" stroke="#F6F3EC" stroke-width="1.6"/><circle cx="12" cy="11.6" r="5.8" fill="none" stroke="#F6F3EC" stroke-width="0.8" opacity="0.6"/><circle cx="12" cy="11.6" r="2.6" fill="#F6F3EC"/></svg>
</div>
</a>

<div style="position: absolute; left: 244px; top: 548px; width: 20px; height: 20px; border-radius: 999px; background: {{t.ink}}; border: 3px solid {{t.surface}}; box-shadow: 0 0 0 10px rgba(228,87,46,0.14); box-sizing: border-box" aria-label="Ma position"></div>

<div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span aria-label="Rep'r" style="display: inline-flex; align-items: flex-start; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 26px; line-height: 1; letter-spacing: -0.02em; color: {{t.ink}}">Rep<svg width="10" height="13" viewBox="0 0 24 30" style="margin: 1px 1px 0 2px" aria-hidden="true"><path d="M12 1.5C6.2 1.5 1.5 6.1 1.5 11.8 1.5 19.3 12 28.5 12 28.5S22.5 19.3 22.5 11.8C22.5 6.1 17.8 1.5 12 1.5Z" fill="#E4572E"/><circle cx="12" cy="11.5" r="4" fill="{{t.land}}"/></svg>r</span>
<div style="display: flex; padding: 4px; background: {{t.surface}}; border-radius: 999px; box-shadow: {{t.shadow}}">
<a href="{{L.carte}}" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; background: {{t.btn}}; color: {{t.btnText}}; font-size: 13px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>Carte</a>
<a href="{{L.carnet}}" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; color: {{t.muted}}; font-size: 13px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Carnet</a>
</div>
</div>

<div style="display: flex; gap: 8px">
<label style="flex-grow: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; background: {{t.surface}}; border-radius: 999px; box-shadow: {{t.shadow}}; color: {{t.muted}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
<input type="search" placeholder="Chercher dans mes rep'rs" aria-label="Chercher dans mes rep'rs" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: Inter, system-ui, sans-serif; font-size: 15px; color: {{t.ink}}">
</label>
<a href="{{L.hub}}" aria-label="Mes carnets" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; background: {{t.surface}}; border-radius: 999px; box-shadow: {{t.shadow}}; color: {{t.ink}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></a>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 178px; display: flex; gap: 8px; padding: 0 16px; overflow: hidden">
<button type="button" aria-label="Tous les filtres" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex-shrink: 0; border: 0; border-radius: 999px; background: {{t.surface}}; box-shadow: {{t.shadow}}; color: {{t.ink}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg></button>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; flex-shrink: 0; border: 0; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; box-shadow: {{t.shadow}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 500; white-space: nowrap">
<sc-if value="{{c.dot}}" hint-placeholder-val="{{ true }}"><span style="width: 10px; height: 10px; border-radius: 999px; background: {{c.dot}}"></span></sc-if>
<sc-if value="{{c.dashed}}" hint-placeholder-val="{{ false }}"><span style="width: 10px; height: 10px; border-radius: 999px; border: 1.5px dashed currentColor; box-sizing: border-box"></span></sc-if>
{{c.label}}</button>
</sc-for>
</div>

<button type="button" aria-label="Me localiser" style="position: absolute; right: 16px; bottom: 112px; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border: 0; border-radius: 999px; background: {{t.surface}}; box-shadow: {{t.shadow}}; color: {{t.ink}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>

<a href="{{L.ajout}}" style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; align-items: center; justify-content: center; gap: 12px; height: 64px; border-radius: 999px; background: {{t.btn}}; color: {{t.btnText}}; box-shadow: 0 8px 24px rgba(29,36,38,0.22); font-size: 17px; font-weight: 600">
<span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; background: #E4572E; color: #FFFFFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>
Poser un rep'r</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const T = {
      light:{bg:'#F6F3EC',surface:'#FFFFFF',ink:'#1D2426',muted:'#6E6A63',line:'#E6E1D6',soft:'#EFEBE2',btn:'#1D2426',btnText:'#F6F3EC',shadow:'0 1px 2px rgba(29,36,38,0.06), 0 6px 20px rgba(29,36,38,0.08)',land:'#ECE6D9',street:'#FAF8F3',minor:'#F3EEE4',water:'#D3DCD8',park:'#DDE2CF',label:'#9C968A'},
      dark:{bg:'#141718',surface:'#1E2224',ink:'#F1EDE4',muted:'#A39E95',line:'#2E3336',soft:'#262B2E',btn:'#F1EDE4',btnText:'#141718',shadow:'0 1px 2px rgba(0,0,0,0.35), 0 6px 20px rgba(0,0,0,0.3)',land:'#1A1E1F',street:'#2B3032',minor:'#232729',water:'#1C282B',park:'#1D2521',label:'#646A6C'}
    };
    const t = dark ? T.dark : T.light;
    const s = dark ? 'Sombre' : '';
    const L = { carte:'Main'+s+'.dc.html', ajout:'Ajout'+s+'.dc.html', fiche:'Fiche'+s+'.dc.html', carnet:'Carnet'+s+'.dc.html', hub:'Hub'+s+'.dc.html' };
    const M = { coeur:['#E4572E','Coup de cœur'], tb:['#F2A541','Très bien'], ok:['#8FB9A8','Correct'], bof:['#9AA5B1','Bof'], ev:['#5B5F66','À éviter'] };
    const raw = [[58,318,'tb'],[150,372,'ok'],[304,318,'coeur'],[92,452,'bof'],[322,430,'tb'],[184,622,'coeur'],[62,664,'ok'],[304,584,'ev'],[226,712,'tb'],[196,440,'coeur']];
    const pins = raw.map(([x,y,k]) => ({ l:x-14, t:y-35, c:M[k][0], label:M[k][1] }));
    const envies = [[122,560],[346,262],[30,596],[160,748]].map(([x,y]) => ({ l:x-14, t:y-35 }));
    const chip = (label, o) => Object.assign({ label, bg:t.surface, fg:t.ink, dot:'', dashed:false }, o || {});
    const chips = [
      chip('Vécu', { bg:t.btn, fg:t.btnText }),
      chip('Envie', { dashed:true }),
      chip('Coup de cœur', { dot:'#E4572E' }),
      chip('Très bien', { dot:'#F2A541' }),
      chip('En amoureux'),
      chip('Midi rapide')
    ];
    return { t, L, pins, envies, chips };
  }
}
</script>
</body>
</html>
