<head>
<meta charset="utf-8">
<title>Rep'r — Ajout rapide</title>
<script src="./support.js"></script>
</head>
<body>

<helmet>

<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: {{t.land}}; font-family: Inter, system-ui, sans-serif; color: {{t.ink}}">

<svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<rect x="28" y="236" width="118" height="92" rx="14" fill="{{t.park}}"/>
<path d="M-20 520 C 70 486, 140 556, 226 524 S 352 446, 420 470" fill="none" stroke="{{t.water}}" stroke-width="40"/>
<path d="M258 -10 C 246 160, 286 300, 266 506" fill="none" stroke="{{t.water}}" stroke-width="12"/>
<g fill="none" stroke="{{t.street}}" stroke-width="9"><path d="M-10 214 C 120 230, 260 240, 400 226"/><path d="M120 -10 C 140 200, 110 420, 140 860"/><path d="M400 60 L 20 470"/><path d="M0 120 L390 180"/></g>
<path d="M12 1.5C6.2 1.5 1.5 6.1 1.5 11.8 1.5 19.3 12 28.5 12 28.5S22.5 19.3 22.5 11.8C22.5 6.1 17.8 1.5 12 1.5Z" transform="translate(180 96) scale(1.3)" fill="#E4572E" stroke="#F6F3EC" stroke-width="1.4"/>
</svg>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: {{t.scrim}}"></div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 20px; padding: 8px 16px 34px; background: {{t.bg}}; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 32px rgba(0,0,0,0.12)">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: {{t.line}}"></div>

<div style="display: flex; align-items: center; justify-content: space-between; margin-top: -8px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 22px; letter-spacing: -0.01em">Poser un rep'r</h1>
<a href="{{L.carte}}" aria-label="Fermer" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: {{t.soft}}; color: {{t.ink}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; background: {{t.surface}}; border-radius: 16px; border: 1px solid {{t.line}}">
<span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: rgba(228,87,46,0.12); color: #E4572E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 600">Café des Écluses</span>
<span style="font-size: 13px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Ici · 48 quai de Valmy, Paris 10ᵉ</span>
</div>
<button type="button" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px">Modifier</button>
</div>
<div style="display: flex; align-items: center; gap: 8px; overflow: hidden">
<span style="font-size: 13px; color: {{t.muted}}; flex-shrink: 0">Pas ici ?</span>
<button type="button" style="height: 32px; padding: 0 12px; flex-shrink: 0; border: 1px solid {{t.line}}; border-radius: 999px; background: transparent; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; font-size: 13px">Boulangerie Mireille</button>
<button type="button" style="height: 32px; padding: 0 12px; flex-shrink: 0; border: 1px solid {{t.line}}; border-radius: 999px; background: transparent; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; font-size: 13px">La Petite Tonnelle</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: {{t.soft}}; border-radius: 999px">
<button type="button" onClick="{{setVecu}}" aria-pressed="{{vecuOn}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 0; border-radius: 999px; background: {{vecuBg}}; color: {{vecuFg}}; box-shadow: {{vecuShadow}}; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Vécu</button>
<button type="button" onClick="{{setEnvie}}" aria-pressed="{{envieOn}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 0; border-radius: 999px; background: {{envieBg}}; color: {{envieFg}}; box-shadow: {{envieShadow}}; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 600"><span style="width: 14px; height: 14px; border-radius: 999px; border: 1.5px dashed currentColor; box-sizing: border-box"></span>Envie</button>
</div>

<sc-if value="{{vecuOn}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 13px; font-weight: 600; color: {{t.muted}}; letter-spacing: 0.04em; text-transform: uppercase">Ton ressenti</span>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
<button type="button" onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 999px; border: 2px solid {{m.ring}}; box-sizing: border-box">
<span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: {{m.c}}; color: #FFFFFF">
<sc-if value="{{m.on}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></sc-if>
</span>
</span>
<span style="font-size: 12px; line-height: 15px; height: 30px; text-align: center; font-weight: {{m.w}}">{{m.label}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{envieOn}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 14px; height: 94px; box-sizing: border-box; padding: 0 16px; border: 1.5px dashed {{t.line}}; border-radius: 16px; color: {{t.muted}}">
<svg width="28" height="35" viewBox="0 0 24 30" aria-hidden="true" style="flex-shrink: 0"><path d="M12 1.5C6.2 1.5 1.5 6.1 1.5 11.8 1.5 19.3 12 28.5 12 28.5S22.5 19.3 22.5 11.8C22.5 6.1 17.8 1.5 12 1.5Z" fill="none" stroke="{{t.ink}}" stroke-width="1.6" stroke-dasharray="2.6 2.2"/><circle cx="12" cy="11.6" r="2.6" fill="none" stroke="{{t.ink}}" stroke-width="1.4"/></svg>
<span style="font-size: 15px; line-height: 1.4">Pas encore testé : il apparaîtra en pointillé sur ta carte. Tu noteras ton ressenti après.</span>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="memo" style="font-size: 13px; font-weight: 600; color: {{t.muted}}; letter-spacing: 0.04em; text-transform: uppercase">Une ligne pour t'en souvenir</label>
<div style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 6px 0 16px; background: {{t.surface}}; border: 1px solid {{t.line}}; border-radius: 16px">
<input id="memo" type="text" placeholder="Flat white parfait, terrasse au soleil…" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 17px; color: {{t.ink}}">
<button type="button" aria-label="Dicter un mémo vocal" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; flex-shrink: 0; border: 0; border-radius: 12px; background: {{t.soft}}; color: {{t.ink}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; margin-top: -4px">
<button type="button" style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 4px; border: 0; border-top: 1px solid {{t.line}}; background: transparent; color: {{t.ink}}; font-family: Inter, system-ui, sans-serif; text-align: left">
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Ajouter des détails</span><span style="font-size: 13px; color: {{t.muted}}">Photos, tags d'occasion, date</span></span>
<span style="display: flex; gap: 10px; color: {{t.muted}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5"/></svg><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
</button>
<a href="{{L.fiche}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; border-radius: 999px; background: {{t.btn}}; color: {{t.btnText}}; font-size: 17px; font-weight: 600">Enregistrer</a>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mood: 'coeur', mode: 'vecu' }; }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const T = {
      light:{bg:'#F6F3EC',surface:'#FFFFFF',ink:'#1D2426',muted:'#6E6A63',line:'#E6E1D6',soft:'#ECE8DF',btn:'#1D2426',btnText:'#F6F3EC',land:'#ECE6D9',street:'#FAF8F3',water:'#D3DCD8',park:'#DDE2CF',scrim:'rgba(29,36,38,0.30)',tabShadow:'0 1px 3px rgba(29,36,38,0.12)'},
      dark:{bg:'#141718',surface:'#1E2224',ink:'#F1EDE4',muted:'#A39E95',line:'#2E3336',soft:'#262B2E',btn:'#F1EDE4',btnText:'#141718',land:'#1A1E1F',street:'#2B3032',water:'#1C282B',park:'#1D2521',scrim:'rgba(0,0,0,0.55)',tabShadow:'0 1px 3px rgba(0,0,0,0.4)'}
    };
    const t = dark ? T.dark : T.light;
    const s = dark ? 'Sombre' : '';
    const L = { carte:'Main'+s+'.dc.html', fiche:'Fiche'+s+'.dc.html' };
    const st = this.state || { mood: 'coeur', mode: 'vecu' };
    const vecuOn = st.mode === 'vecu';
    const envieOn = !vecuOn;
    const on = { bg: t.surface, fg: t.ink, sh: t.tabShadow };
    const off = { bg: 'transparent', fg: t.muted, sh: 'none' };
    const a = vecuOn ? on : off, b = vecuOn ? off : on;
    const list = [['coeur','#E4572E','Coup de cœur'],['tb','#F2A541','Très bien'],['ok','#8FB9A8','Correct'],['bof','#9AA5B1','Bof'],['ev','#5B5F66','À éviter']];
    const moods = list.map(([id,c,label]) => {
      const sel = st.mood === id;
      return { id, c, label, on: sel, ring: sel ? c : 'transparent', w: sel ? 600 : 400, pick: () => this.setState({ mood: id }) };
    });
    return {
      t, L, moods, vecuOn, envieOn,
      vecuBg: a.bg, vecuFg: a.fg, vecuShadow: a.sh,
      envieBg: b.bg, envieFg: b.fg, envieShadow: b.sh,
      setVecu: () => this.setState({ mode: 'vecu' }),
      setEnvie: () => this.setState({ mode: 'envie' })
    };
  }
}
</script>
</body>
</html>
